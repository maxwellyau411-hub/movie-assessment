# Builds and tests both services and the frontend, then starts the Compose stack the way a
# reviewer would (cp .env.example .env && docker compose up --build) and checks the GraphQL -> gRPC chain.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # ktlint, warnings as errors, JUnit + Testcontainers (Docker is preinstalled on the runner).
      - run: ./gradlew build --console=plain

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # Version comes from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 600
      - name: GraphQL answers and reaches media-service over gRPC
        run: |
          curl -fsS http://127.0.0.1:8088/graphql \
            -H 'Content-Type: application/json' \
            --data '{"query":"{ serviceStatus { catalogue mediaService } movies { totalCount { count } } }"}' \
            | tee response.json
          jq -e '.data.serviceStatus.catalogue == "UP" and .data.serviceStatus.mediaService == "UP" and .data.movies.totalCount.count > 0' response.json
      - run: infra/postgres/check-isolation.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

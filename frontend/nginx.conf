# Single browser entry point: static SPA, same-origin proxy to Catalogue's GraphQL endpoint, and
# images from media-service. Actuator endpoints and gRPC ports are never exposed through here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Matches Catalogue's multipart request limit (poster upload).
    client_max_body_size 6m;

    location = /graphql {
        proxy_pass http://catalogue-service:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port, so any absolute URL Catalogue builds points back here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream request bodies so browser upload progress reflects the real transfer.
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # Stored images. media-service sets the long cache headers (the files never change) and serves
    # only its two image folders; anything else under /media/ is a 404 there.
    location /media/ {
        proxy_pass http://media-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
    }

    # In-browser GraphQL editor. Catalogue serves it only when CATALOGUE_GRAPHIQL=true (local play).
    location = /graphiql {
        proxy_pass http://catalogue-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
